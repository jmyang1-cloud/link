name: Diagnose
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          mkdir out && cd out
          UA='Mozilla/5.0 (Linux; Android 14; SM-S918N Build/UP1A.231005.007; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/126.0.6478.134 Mobile Safari/537.36;KAKAOTALK 2410830'
          for h in pick.airecipe.co.kr link.airecipe.co.kr link.jmyang1.workers.dev airecipe.co.kr; do
            {
              echo "=== $h"
              echo "--- cert chain"
              echo | openssl s_client -connect $h:443 -servername $h -showcerts 2>/dev/null | grep -E '^ *[0-9]+ s:|^ *i:|Verify return code|^   v:|NotBefore|a:PKEY' | head -20
              echo "--- cert details"
              echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null
              echo "--- tls1.2"
              echo | openssl s_client -connect $h:443 -servername $h -tls1_2 2>/dev/null | grep -E 'Protocol|Cipher is|Verify return' | head -3
              echo "--- https kakao UA"
              curl -sS -o /dev/null -D - -m 20 -A "$UA" "https://$h/" | grep -iE '^HTTP|^server|^location|^cf-|^content-type|^alt-svc|^strict' 
              echo "--- http kakao UA"
              curl -sS -o /dev/null -D - -m 20 -A "$UA" "http://$h/" | grep -iE '^HTTP|^location|^server'
              echo "--- https default UA"
              curl -sS -o /dev/null -w '%{http_code} %{ssl_verify_result} %{http_version}\n' -m 20 "https://$h/"
              echo "--- dns"
              dig +short A $h | head -3; dig +short AAAA $h | head -2; echo "HTTPS RR:"; dig +short TYPE65 $h | cut -c1-120
            } > "$h.txt" 2>&1 || true
          done
          { dig +short NS airecipe.co.kr; echo "CAA:"; dig +short CAA airecipe.co.kr; echo "DS:"; dig +short DS airecipe.co.kr; } > zone.txt 2>&1
          git init -q -b diag-logs && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "diag" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-logs
